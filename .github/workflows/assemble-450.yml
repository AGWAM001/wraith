name: assemble-450

# One-shot helper. The tool used to push this branch cannot carry a 40 kB file
# in a single request, so the source changes travel as patches in `.ci-parts/`.
# This workflow applies them, commits, and removes both itself and the patches.
# The push it makes triggers one more run, which finds nothing to do and exits.

on:
  push:
    branches: [fix/450-batch-account-summaries]

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply the patches
        run: |
          set -euo pipefail
          if [ ! -d .ci-parts ]; then
            echo "Nothing to apply — the patches have already been committed."
            exit 0
          fi
          for patch in .ci-parts/*.patch; do
            git apply --verbose "$patch"
          done

      - name: Commit and push
        run: |
          set -euo pipefail
          if [ ! -d .ci-parts ]; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "DevScoopee"
          git config user.email "devscoopee@users.noreply.github.com"
          rm -rf .ci-parts .github/workflows/assemble-450.yml
          git add -A
          git commit -m "perf(db): write account totals in chunked multi-row UPSERTs (#450)"
          git push
